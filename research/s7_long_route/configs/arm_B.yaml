# S7 arm B: progressive curriculum 2 -> 3 -> 5 -> 7 -> T (T = {7,10}), random init   (PREPARED, NOT RUN; needs approval)
name: arm_B
description: "progressive curriculum 2 -> 3 -> 5 -> 7 -> T (T = {7,10}), random init"
ppo:                       # = S1 / S3 / Baseline-0 hyperparameters (no change)
  n_steps: 512
  batch_size: 256
  n_epochs: 4
  target_kl: 0.03
  learning_rate: 3.0e-4
  ent_coef: 0.01
  gamma: 0.99
training:
  total_decisions: 100000    # PROPOSED pilot budget per run (identical for A/B/C); see SYNTHETIC_LONG_ROUTE_S7.md section 8
  eval_every: 10000          # validation manifest, deterministic policy; TEST only once on the final checkpoint
  stages: [[2], [3], [5], [7], [7, 10]]
  advance:                   # PREREGISTERED stage-advancement rule (curriculum arms only)
    window: 100              # last 100 training episodes of the current stage
    success_threshold: 0.7
    min_stage_decisions: 4096
    max_stage_decisions: 12000   # a stage is left at this budget even if the threshold was not met
reward: "+1 at full house-carpark connectivity, 0 otherwise (no intermediate, no demonstrations, no privileged observation)"
