name: arm_A
description: "direct: random init, trained only on the target distribution T = uniform over required lengths {7,10}"
ppo:                       # = S1 / S3 / Baseline-0 hyperparameters (no change)
  n_steps: 512
  batch_size: 256
  n_epochs: 4
  target_kl: 0.03
  learning_rate: 3.0e-4
  ent_coef: 0.01
  gamma: 0.99
training:
