# Gap-1, Experiment B: sparse completion reward only.
experiment:
  name: gap1_completion
  description: "MaskablePPO on Gap-1 tasks with the sparse completion reward (1 on success, 0 otherwise)"
  hypothesis: "With trivial credit assignment the current representation/policy can learn the one-edge construction."
  tags: [gap1, completion]

environment:
  task: gap1
  initialization: connected
  reward: completion
  decision_interval_seconds: 1.0
  gap1:
    manifest_dir: C:/Users/TKA/Desktop/mini moto/research/gap1/manifests
    construction_window: 20
    continuation_decisions: 40

policy:
  algorithm: maskable_ppo
  network: mlp
  hyperparameters:            # identical to the frozen Baseline-0 native run
    n_steps: 512
    batch_size: 256
    n_epochs: 4
    target_kl: 0.03
    gamma: 0.99

training:
  total_timesteps: 100000
  seeds: [101]
  checkpoint_every: 20000
  eval_every: 20000
  n_envs: 1
  headless: true

evaluation:                    # TEST is NOT used inside the run; see experiments.gap1.final_test
  seeds: [1]
