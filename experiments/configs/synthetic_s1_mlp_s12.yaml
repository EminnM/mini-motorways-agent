# Experiment S1: flat MLP vs spatial CNN, synthetic Gap-1, immediate completion reward, native-compatible action space.
experiment:
  name: syn_s1_mlp_s12
  description: "S1 pilot: mlp policy on synthetic Gap-1 (completion reward, 3111-action native-compatible space)"
  hypothesis: "H1: a spatial CNN learns location-invariant gap completion that a flat MLP does not (same budget, seeds, tasks)."
  tags: [synthetic, S1, H1, mlp]

task:
  n_gaps: 1
  reward: completion
  construction_window: 20

policy:
  network: mlp
  hyperparameters:       # identical to the frozen native Baseline-0 run
    n_steps: 512
    batch_size: 256
    n_epochs: 4
    target_kl: 0.03
    gamma: 0.99
    learning_rate: 0.0003
    ent_coef: 0.01

training:
  total_timesteps: 50000
  seeds: [12]
  checkpoint_every: 10000
  torch_threads: 2

evaluation:
  also_stochastic: true
