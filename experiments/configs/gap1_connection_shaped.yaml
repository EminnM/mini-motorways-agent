# Gap-1, Experiment D: existing connection shaping.
experiment:
  name: gap1_connection_shaped
  description: "MaskablePPO on Gap-1 tasks with the the existing connection-shaped reward (coefficient 1.0, as Baseline-0)"
  hypothesis: "The existing shaping signal becomes useful in the simplified task."
  tags: [gap1, connection_shaped]

environment:
  task: gap1
  initialization: connected
  reward: connection_shaped
  shaping_coefficient: 1.0
  decision_interval_seconds: 1.0
  gap1:
    manifest_dir: C:/Users/TKA/Desktop/mini moto/research/gap1/manifests
    construction_window: 20
    continuation_decisions: 40

policy:
  algorithm: maskable_ppo
  network: mlp
  hyperparameters:            # identical to the frozen Baseline-0 native run
    n_steps: 512
    batch_size: 256
    n_epochs: 4
    target_kl: 0.03
    gamma: 0.99

training:
  total_timesteps: 100000
  seeds: [101]
  checkpoint_every: 20000
  eval_every: 20000
  n_envs: 1
  headless: true

evaluation:                    # TEST is NOT used inside the run; see experiments.gap1.final_test
  seeds: [1]
