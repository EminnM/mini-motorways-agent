# Native normal-start evaluation, validation seeds (learning curve). Explicit env so that WAIT/RANDOM/checkpoints use identical conditions
# (matches python/phase11a_runner.py defaults used for the frozen baselines: 1.0 s decisions, 600-decision horizon).
experiment:
  name: eval_native_pilot_val
environment:
  initialization: normal
  start_gap: 0
  reward: native_score
  decision_interval_seconds: 1.0
  episode_horizon_decisions: 600
evaluation:
  seeds: [182150, 205907, 229664, 253421, 261340, 269259]
  episodes_per_seed: 1
  deterministic: true
  random_seed: 0
logging:
  diagnostics: true
